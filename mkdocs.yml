site_name: LitCurate
site_description: Config-driven literature-to-database pipeline
site_url: https://mineralscloud.github.io/litcurate/
site_author: Abin Shakya

repo_name: MineralsCloud/litcurate
repo_url: https://github.com/MineralsCloud/litcurate/
edit_uri: edit/main/docs/

copyright: Copyright &copy; LitCurate contributors &mdash; <a href="#license">MIT</a>

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MineralsCloud/litcurate/
      name: GitHub

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
    annotation: material/arrow-right-circle

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - User guide:
      - user-guide/index.md
      - Installation: user-guide/installation.md
      - First steps: user-guide/first-steps.md
      - Concepts: user-guide/concepts.md
      - Running a pipeline: user-guide/running.md
      - Custom domains: user-guide/custom-domains.md
  - Reference:
      - reference/index.md
      - Stages: reference/stages.md
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Environment variables: reference/environment.md
      - Schemas & prompts: reference/schemas.md
      - LLM providers: reference/llm.md
      - Artifacts & resume: reference/artifacts.md
      - Export format: reference/export.md
  - Help:
      - help/index.md
      - Troubleshooting: help/troubleshooting.md
