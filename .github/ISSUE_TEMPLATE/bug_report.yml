name: Bug report
description: Report unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LitCurate version
      placeholder: "0.1.0 (`litcurate --version`)"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, config snippets, and relevant logs (redact API keys).
    validations:
      required: true
