name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install -U pip "ruff>=0.6.0"
      - name: Ruff
        run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (without Marker)
        run: |
          python -m pip install -U pip
          python -m pip install \
            "anthropic>=0.40.0" \
            "httpx>=0.27.0" \
            "jsonschema>=4.0.0" \
            "pandas>=2.0.0" \
            "pyarrow>=14.0.0" \
            "pydantic>=2.0.0" \
            "pydantic-settings>=2.0.0" \
            "python-dotenv>=1.0.0" \
            "pyyaml>=6.0" \
            "typer>=0.12.0" \
            "rich>=13.0.0" \
            "pytest>=8.0.0" \
            "pyalex>=0.21"
          python -m pip install -e . --no-deps
      - name: Test
        run: pytest -q
